syntax = "proto3";
option csharp_namespace = "_4EPlatform.Application.Protos";
import "google/protobuf/wrappers.proto";


service ThanksMessageSevice
{
	rpc GetThanksMessagesByUserId (GetThanksMessagesByUserIdRequest) returns (GetThanksMessagesByUserIdResponse);
}

message GetThanksMessagesByUserIdRequest{

    string UserId = 1;
    int32 PageNumber=2;
    int32 PageSize=3;

}

message GetThanksMessagesByUserIdResponse {
    repeated ThanksMessages ThanksMessages = 1;
    int32 PageNumber=2;
    int32 PageSize=3;
    int32 TotalItems = 4;
    int32 TotalPages=5;
    int32 StatusEnum =6;
    string Message=7;
    
}
message ThanksMessages {
string UserId =1;
string thnakMessage =2;
int32 LikeCount =3;
bool Islike =4;
string Id = 5;
string Date=6;


}